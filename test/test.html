<!DOCTYPE html>
<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
<style type='text/css'>
@font-face {
  font-family: 'TestFont';
  src: url("test.ttf");
  font-display: block;
}
@font-face {
  font-family: 'ReferenceFont';
  src: url("eot.ttf");
  font-display: block;
}
.reference {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'ReferenceFont';
}
.test {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'TestFont';
}
</style>
</head>
<body>
<table border=1 id="table"></table>
<script type="text/javascript">
  const data = [
    ["A1", "&#x13000;"],
    ["A1 vj O1", "&#x13000;&#x13430;&#x13250;"],
    ["N35 vj X1", "&#x13216;&#x13430;&#x133cf;"],
    ["A1 hj B1 vj Z2", "&#x13000;&#x13431;&#x13050;&#x13430;&#x133e5;"],
    ["G39&ra <i mn:n:N36 ra:1 ms s sw>", "𓅭𓇳𓍹𓐼𓇋𓏠𓐰𓈖𓐰𓈘𓇳𓐰𓏤𓄟𓋴𓇓𓐽𓍺"],
    ["a", "𓃒𓐰𓂡𓌸𓁦"],
    ["test", "&#x13258;&#x1343c;&#x130d2;&#x13430;&#x130a1;&#x1320d;&#x13430;&#x1341d;&#x132c6;&#x1343d;&#x13282;"],
    ["test", "&#x13258;&#x1343c;&#x130d2;&#x13430;&#x130a1;&#x13338;&#x13066;&#x1343d;&#x13282;"],
    ["test", "&#x13258;&#x1343c;&#x130d2;&#x13430;&#x130a1;&#x13338;&#x13066;&#x13379;&#x1343c;&#x131f3;&#x131cb;&#x133e0;&#x13430;&#x13216;&#x13430;&#x13218;&#x1311f;&#x132f4;&#x132f4;&#x1343d;&#x1337a;&#x1343d;&#x13282;"],
    ["test", "&#x13258;&#x1343c;&#x13000;&#x13379;&#x1343c;&#x13000;&#x1343d;&#x1337a;&#x1343d;&#x13282;"],
    ["test", "&#x13258;&#x1343c;&#x13000;&#x1343d;&#x13282;"],
  ];
  const table = document.getElementById("table");
  const makeTd = (content, klass) => {
    const td = document.createElement("td");
    const div = document.createElement("div");
    div.innerHTML = content.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    div.classList.add(klass);
    td.appendChild(div);
    return td;
  };
  for (const [label, hieroglyph] of data) {
    const tr = document.createElement("tr");

    const title = document.createElement("td");
    title.innerHTML = label;
    tr.appendChild(title);

    const reference = makeTd(hieroglyph, "reference");
    tr.appendChild(reference);

    const test = makeTd(hieroglyph, "test");
    tr.appendChild(test);

    table.appendChild(tr);
  }
</script>
</body>
</html>
