<!DOCTYPE html>
<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
<style type='text/css'>
@font-face {
  font-family: 'TestFont';
  src: url("test.ttf");
  font-display: block;
}
@font-face {
  font-family: 'ReferenceFont';
  src: url("eot.ttf");
  font-display: block;
}
.reference {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'ReferenceFont';
}
.test {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'TestFont';
}
</style>
</head>
<body>
<table border=1 id="table"></table>
<script type="text/javascript">
  const data = [
    ["A1", "&#x13000;"],
    ["A1 vj O1", "&#x13000;&#x13430;&#x13250;"],
    ["N35 vj X1", "&#x13216;&#x13430;&#x133cf;"],
    ["A1 hj B1 vj Z2", "&#x13000;&#x13431;&#x13050;&#x13430;&#x133e5;"]
  ];
  const table = document.getElementById("table");
  const makeTd = (content, klass) => {
    const td = document.createElement("td");
    const div = document.createElement("div");
    div.innerHTML = content;
    div.classList.add(klass);
    td.appendChild(div);
    return td;
  };
  for (const [label, hieroglyph] of data) {
    const tr = document.createElement("tr");

    const title = document.createElement("td");
    title.innerHTML = label;
    tr.appendChild(title);

    const reference = makeTd(hieroglyph, "reference");
    tr.appendChild(reference);

    const test = makeTd(hieroglyph, "test");
    tr.appendChild(test);

    table.appendChild(tr);
  }
</script>
</body>
</html>
