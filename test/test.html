<!DOCTYPE html>
<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
<style type='text/css'>
@font-face {
  font-family: 'TestFont';
  src: url("test.ttf");
  font-display: block;
}
@font-face {
  font-family: 'ReferenceFont';
  src: url("eot.ttf");
  font-display: block;
}
.reference {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'ReferenceFont';
}
.test {
  background-color: rgba(0, 0, 0, 0.2);
  font-size: 60px;
  font-family: 'TestFont';
}
</style>
</head>
<body>
<table border=1 id="table"></table>
<script type="text/javascript">
  const cb = "&#x13379;";
  const esb = "&#x1343c;";
  const ese = "&#x1343d;";
  const ce = "&#x1337a;"
  const A1 = "&#x13000;";
  const hwtb = "&#x13258;"
  const O33a = "&#x13282;";
  const crb = "&#x1342f;";
  const cre = "&#x1337b;"
  const hwtbb = "&#x13259;";
  const hwte = "&#x1325D;"
  const hwttb = "&#x1325A;";
  const hwtte = "&#x1325B;";
  const hwtbe = "&#x1325C;";
  const data = [
    ["A1", `${A1}`],
    ["A1 vj O1", `${A1}&#x13430;&#x13250;`],
    ["N35 vj X1", "&#x13216;&#x13430;&#x133cf;"],
    ["A1 hj B1 vj Z2", `${A1}&#x13431;&#x13050;&#x13430;&#x133e5;`],
    ["G39&ra <i mn:n:N36 ra:1 ms s sw>", "𓅭𓇳𓍹𓐼𓇋𓏠𓐰𓈖𓐰𓈘𓇳𓐰𓏤𓄟𓋴𓇓𓐽𓍺"],
    ["a", "𓃒𓐰𓂡𓌸𓁦"],
    ["test", `${hwtb}${esb}&#x130d2;&#x13430;&#x130a1;&#x1320d;&#x13430;&#x1341d;&#x132c6;${ese}${O33a}`],
    ["test", `${hwtb}${esb}&#x130d2;&#x13430;&#x130a1;&#x13338;&#x13066;${ese}${O33a}`],
    ["test", `${hwtb}${esb}&#x130d2;&#x13430;&#x130a1;&#x13338;&#x13066;${cb}${esb}&#x131f3;&#x131cb;&#x133e0;&#x13430;&#x13216;&#x13430;&#x13218;&#x1311f;&#x132f4;&#x132f4;${ese}${ce}${ese}${O33a}`],
    ["test", `${hwtb}${esb}${A1}${cb}${esb}${A1}${ese}${ce}${ese}${O33a}`],
    ["test", `${hwtb}${esb}${A1}${ese}${O33a}`],
    ["test", `${hwtb}${esb}${A1}${hwtb}${esb}${A1}${ese}${O33a}${ese}${O33a}`],
    ["test", `${cb}${esb}${A1}${cb}${esb}${A1}${ese}${ce}${ese}${ce}`],
    ["test", `${crb}${esb}${A1}${crb}${esb}${A1}${ese}${cre}${ese}${cre}`],
    ["", `${hwtbb}${esb}${A1}${ese}${hwte}`],
    ["", `${hwttb}${esb}${A1}${ese}${hwtte}`],
    ["", `${hwttb}${esb}${A1}${ese}${hwtbe}`],
    ["", `${hwttb}${esb}${A1}${hwttb}${esb}${A1}${ese}${hwte}${ese}${hwte}`],
    ["", `${hwtbb}${esb}${A1}${hwtbb}${esb}${A1}${ese}${hwtbe}${ese}${hwtbe}`],
    ["", `${hwttb}${esb}${A1}${hwttb}${esb}${A1}${ese}${hwtte}${ese}${hwtte}`],
  ];
  const table = document.getElementById("table");
  const makeTd = (content, klass) => {
    const td = document.createElement("td");
    const div = document.createElement("div");
    div.innerHTML = content.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    div.classList.add(klass);
    td.appendChild(div);
    return td;
  };
  for (const [label, hieroglyph] of data) {
    const tr = document.createElement("tr");

    const title = document.createElement("td");
    title.innerHTML = label;
    tr.appendChild(title);

    const reference = makeTd(hieroglyph, "reference");
    tr.appendChild(reference);

    const test = makeTd(hieroglyph, "test");
    tr.appendChild(test);

    table.appendChild(tr);
  }
</script>
</body>
</html>
