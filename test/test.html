<!DOCTYPE html>
<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
<style type='text/css'>
@font-face {
  font-family: 'TestFont';
  src: url("test.ttf");
  font-display: block;
}
@font-face {
  font-family: 'ReferenceFont';
  src: url("eot.ttf");
  font-display: block;
}
.reference {
  font-size: 60px;
  font-family: 'ReferenceFont';
  white-space: pre;
}
.test {
  font-size: 60px;
  font-family: 'TestFont';
  white-space: pre;
}
.mdc {
  font-size: 60px;
  font-family: 'TestFont';
  white-space: pre;
}
.ltrh {
}
.rtlh {
  font-feature-settings: "rtlm";
}
.ltrv {
  writing-mode: vertical-lr;
  font-feature-settings: "vrt2";
}
.rtlv {
  writing-mode: vertical-rl;
  font-feature-settings: "rtlm", "vrt2";
}
</style>
</head>
<body>
<label for="direction">Writing direction:</label>
<select id="direction">
  <option value="ltrh">LtR Horizontal</option>
  <option value="rtlh">RtL Horizontal</option>
  <option value="ltrv">LtR Vertical</option>
  <option value="rtlv">RtL Vertical</option>
</select>
<table border=1 id="table">
<tr>
  <td>MdC</td>
  <td>reference font</td>
  <td>rendering Unicode characters</td>
  <td>rendering MdC</td>
</tr>
</table>
<script type="text/javascript">
  const cb = "&#x13379;";
  const esb = "&#x1343c;";
  const ese = "&#x1343d;";
  const ce = "&#x1337a;"
  const A1 = "&#x13000;";
  const E1 = "&#x130d2;";
  const hwtb = "&#x13258;"
  const O33a = "&#x13282;";
  const crb = "&#x1342f;";
  const cre = "&#x1337b;"
  const hwtbb = "&#x13259;";
  const hwte = "&#x1325D;"
  const hwttb = "&#x1325A;";
  const hwtte = "&#x1325B;";
  const hwtbe = "&#x1325C;";
  const vj = "&#x13430;";
  const O1 = "&#x13250;";
  const N35 = "&#x13216;";
  const X1 = "&#x133cf;";
  const B1 = "&#x13050;";
  const hj = "&#x13431;";
  const Z2 = "&#x133e5;";
  const D40 = "&#x130a1;";
  const xa = "&#x1320d;";
  const Aa15 = "&#x1341d;";
  const R19 = "&#x132c6;";
  const mr = "&#x13338;";
  const mAat = "&#x13066;";
  const ra = "&#x131f3;";
  const i = "&#x131cb;";
  const mn = "&#x133e0;";
  const N36 = "&#x13218;";
  const ms = "&#x1311f;";
  const s = "&#x132f4;";
  const G39 = "&#x1316d;"
  const Z1 = "&#x133e4;"
  const sw = "&#x131d3;"
  const te = "&#x13434;";
  const I10 = "&#x13193;";
  const bs = "&#x13433;";
  const D46 = "&#x130A7;";
  const L2a = "&#x131A5;";
  const nb = "&#x1339F;";
  const N17 = "&#x131FF;";
  const ir = "&#x13079;";
  const x = "&#x1340D;";
  const t = X1;
  const xpr = "&#x131A3;";
  const ss = "&#x13437;";
  const se = "&#x13438;";
  const di = "&#x133D9;";
  const anx = "&#x132F9;";
  const mi = "&#x133C7;";
  const D = I10;
  const tA = "&#x131FE;";
  const nTr = "&#x132B9;";
  const nfr = "&#x13124;";
  const mAa = "&#x13419;";
  const VS3 = "&#xfe02;";
  const xrw = "&#x132A4;";
  const r = "&#x1308B;";
  const st = "&#x132A8;";
  const G37 = "&#x1316A;";
  const w = "&#x13171;";
  const mirror = "&#x13440;";
  const ewb = "&#x1343E;";
  const ewe = "&#x1343F;";
  const hwtwb = "&#x13288;";
  const hwtwe = "&#x13289;";
  const cwb = "&#x13286;";
  const cwe = "&#x13287;";
  const dq1 = "&#x13447;";
  const dq2 = "&#x13448;";
  const dq12 = "&#x13449;";
  const dq3 = "&#x1344A;";
  const dq13 = "&#x1344B;";
  const dq23 = "&#x1344C;";
  const dq123 = "&#x1344D;";
  const dq4 = "&#x1344E;";
  const dq14 = "&#x1344F;";
  const dq24 = "&#x13450;";
  const dq124 = "&#x13451;";
  const dq34 = "&#x13452;";
  const dq134 = "&#x13453;";
  const dq234 = "&#x13454;";
  const dq1234 = "&#x13455;";
  const F39 = "&#x1312A;";
  const bi = "&#x1343b;";
  const Aa1 = "&#x1340D;";
  const C2 = "&#x1305B;";
  const z = "&#x13283;";
  const A53 = "&#x1303E;";
  const A65 = "&#x1304A;";
  const A18 = "&#x13016;";
  const V13 = "&#x1337F;";
  const V3 = "&#x1336E;";
  const data = [
    [`${A1}`, "A1"],
    [`${A1}${vj}${O1}`, "A1:O1"],
    [`${N35}${vj}${X1}`, "n:t"],
    [`${A1}${hj}${B1}${vj}${Z2}`, "A1*B1:Z2"],
    [`${G39}${te}${ra}${cb}${esb}${i}${mn}${vj}${N35}${vj}${N36}${ra}${vj}${Z1}${ms}${s}${sw}${ese}${ce}`, "G39 & ra <i mn:n:N36 ra:1 ms s sw>"],
    [`${G39}${te}${ra}${cb}${esb}${i}${hj}${ss}${mn}${vj}${N35}${vj}${N36}${se}${C2}${hj}${ms}${z}${vj}${z}${ese}${ce}`, ``],
    [`${cb}${esb}${A1}${cb}${esb}${Z1}${A53}${A65}${A18}${V13}${V3}${ese}${ce}${ese}${ce}`, ``], // WxH, foreach W 1 to 6
    [`${E1}${vj}${D40}${mr}${mAat}`, "E1:D40 mr mAat"],
    [`${hwtb}${esb}${E1}${vj}${D40}${xa}${vj}${Aa15}${R19}${ese}${O33a}`, "<s1 E1:D40 xa:Aa15 R19 s2>"],
    [`${hwtb}${esb}${E1}${vj}${D40}${mr}${mAat}${ese}${O33a}`, "<h1 E1:D40 mr mAat s2>"],
    [`${hwtb}${esb}${E1}${vj}${D40}${mr}${mAat}${cb}${esb}${ra}${i}${mn}${vj}${N35}${vj}${N36}${ms}${s}${s}${ese}${ce}${ese}${O33a}`, "<h1 E1:D40 mr mAat <ra i mn:n:N36 ms s s> s2>"],
    [`${hwtb}${esb}${A1}${cb}${esb}${A1}${ese}${ce}${ese}${O33a}`, "<h1 A1 < A1 > s2>"],
    [`${hwtb}${esb}${A1}${ese}${O33a}`, "<s1 A1 s2>"],
    [`${hwtb}${esb}${A1}${hwtb}${esb}${A1}${ese}${O33a}${ese}${O33a}`, "<s1 A1 <s1 A1 s2> s2>"],
    [`${cb}${esb}${A1}${cb}${esb}${A1}${ese}${ce}${ese}${ce}`, "<1 A1 < A1 2> >"],
    [`${crb}${esb}${A1}${crb}${esb}${A1}${ese}${cre}${ese}${cre}`, "<2 A1 <2 A1 1> 1>"],
    [`${hwtbb}${esb}${A1}${ese}${hwte}`, "<h2 A1 h1>"],
    [`${hwttb}${esb}${A1}${ese}${hwtte}`, "<h3 A1 h3>"],
    [`${hwttb}${esb}${A1}${ese}${hwtbe}`, "<h3 A1 h2>"],
    [`${hwttb}${esb}${A1}${hwttb}${esb}${A1}${ese}${hwte}${ese}${hwte}`, "<h3 A1 <h3 A1 h1> h1>"],
    [`${hwtbb}${esb}${A1}${hwtbb}${esb}${A1}${ese}${hwtbe}${ese}${hwtbe}`, "<h2 A1 <h2 A1 h2> h2>"],
    [`${hwttb}${esb}${A1}${hwttb}${esb}${A1}${ese}${hwtte}${ese}${hwtte}`, "<h3-A1-<h3-A1-h3>-h3>"],
    [`${I10}${bs}${D46}`, "D&d"],
    [
      `${cb}${esb}${L2a}${nb}${vj}${N17}${vj}${N17}${nb}${vj}${ir}${vj}${x}${hj}${t}${cb}${esb}${ra}${xpr}${Z2}${vj}${nb}${ese}${ce}${di}${anx}${ra}${mi}${D}${bs}${ss}${t}${vj}${tA}${se}${ese}${ce}`,
      "<L2a nb:N17:N17 nb:ir:x*t <ra xpr Z2:nb> di anx ra mi D&(t:tA)>"
    ],
    [
      `${cb}${esb}${nTr}${nfr}${nb}${vj}${N17}${vj}${N17}${nb}${vj}${ir}${vj}${x}${hj}${t}${L2a}${cb}${esb}${ra}${mn}${xpr}${ese}${ce}${mAa}${vj}${xrw}${VS3}${x}${vj}${r}${ir}${vj}${st}${hj}${nTr}${ese}${ce}`,
      "<nTr nfr nb:N17:N17 nb:ir:x*t L2a<ra mn xpr> mAa:xrw\\r1 x:r ir:st*nTr>"
    ],
    [`${G37}${bs}${t}`, `G37&t`],
    [`${w}${bs}${t}${te}${t}`, `w&t&t`],
    [`${A1}${mirror}${A1}`, `A1\\A1`],
    [`${cwb}${ewb}${A1}${ewe}${cwe}`, ``],
    [`${hwtwb}${ewb}${A1}${t}${N35}${ewe}${hwtwe}`, `<F A1 >`],
    [`${cb}${esb}${A1}${hwtwb}${ewb}${A1}${t}${N35}${ewe}${hwtwe}${ese}${ce}`, `< <F A1 > >`],
    [`${A1}${dq1234}${B1}${dq13}`, `A1#1234 B1#12`],
    [`${F39}${bi}${Aa1}`, ``],
  ];
  const table = document.getElementById("table");
  const filter = (s) => {
    return s.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
  };
  const makeTd = (content, klass) => {
    const td = document.createElement("td");
    const div = document.createElement("div");
    if (typeof content === "string") {
      div.innerHTML = filter(content);
    }
    div.classList.add(klass);
    td.appendChild(div);
    return td;
  };
  for (const [hieroglyph, mdc] of data) {
    const tr = document.createElement("tr");

    const title = document.createElement("td");
    if (typeof mdc === "string") {
      title.innerHTML = filter(mdc);
    }
    tr.appendChild(title);

    const reference = makeTd(hieroglyph, "reference");
    tr.appendChild(reference);

    const test = makeTd(hieroglyph, "test");
    tr.appendChild(test);

    const m = makeTd(mdc, "mdc");
    tr.appendChild(m);

    table.appendChild(tr);
  }

  const changeDirection = (dir) => {
    const classes = ["ltrh", "rtlh", "ltrv", "rtlv"];
    for (const div of document.getElementsByTagName("div")) {
      if (!div.classList.contains("test") && !div.classList.contains("reference") && !div.classList.contains("mdc")) {
        continue;
      }
      classes.forEach(c => div.classList.remove(c));
      div.classList.add(dir);
    }
  };
  changeDirection("ltrv");
  const select = document.getElementById("direction");
  select.addEventListener("change", (evt) => {
    changeDirection(evt.currentTarget.value);
  });
</script>
</body>
</html>
